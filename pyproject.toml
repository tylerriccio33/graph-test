[project]
name = "graph-test"
version = "0.1.0"
description = "Lightweight test selection/ranking for mixed Rust + Python repos"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
graph-test = "graph_test.cli:main"

[project.entry-points.pytest11]
graph_test = "graph_test.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyrefly>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
